    <text x="24" y="38" fill="#E7EDF2" font-family="Arial, sans-serif" font-size="22" font-weight="700">PRONTO</text>
    <text x="24" y="64" fill="#82909C" font-family="Arial, sans-serif" font-size="15">Fluxo lento só na ação atual</text>
    <g transform="translate(53 108)"><use href="#large-slot"/></g>
    <path d="M70 221 H130" stroke="#0788D8" stroke-width="7" stroke-linecap="round"/>
    <text x="24" y="294" fill="#AEB8C0" font-family="Arial, sans-serif" font-size="14">Um ciclo a cada 3,2 s.</text>
  </g>

  <g transform="translate(408 592)">
    <rect width="316" height="325" rx="14" fill="#081018" stroke="#22313D" stroke-width="2"/>
    <text x="24" y="38" fill="#E7EDF2" font-family="Arial, sans-serif" font-size="22" font-weight="700">COOLDOWN</text>
    <text x="24" y="64" fill="#82909C" font-family="Arial, sans-serif" font-size="15">Swipe cinza + número opcional</text>
