<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050">
  <rect width="1800" height="1050" fill="#05080C"/>
  <text x="70" y="72" fill="#E7EDF2" font-family="Arial, sans-serif" font-size="34" font-weight="700">UI-DESIGN-007 · MOVIMENTO E ESTADOS</text>
  <text x="70" y="112" fill="#82909C" font-family="Arial, sans-serif" font-size="18">Referência técnica — labels não pertencem ao HUD</text>

  <defs>
    <g id="small-slot">
      <rect x="0" y="0" width="96" height="96" rx="9" fill="#0A1016" stroke="#56616B" stroke-width="3"/>
      <rect x="8" y="8" width="80" height="80" rx="5" fill="#10202B" stroke="#07131D" stroke-width="7"/>
      <path d="M12 10 H43" stroke="#0788D8" stroke-width="5" stroke-linecap="round"/>
    </g>
    <g id="large-slot">
      <rect x="0" y="0" width="210" height="124" rx="10" fill="#0A1016" stroke="#66717B" stroke-width="3"/>
      <rect x="8" y="8" width="194" height="108" rx="6" fill="#10202B" stroke="#07131D" stroke-width="8"/>
