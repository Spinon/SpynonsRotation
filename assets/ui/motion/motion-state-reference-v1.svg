    <text x="24" y="38" fill="#E7EDF2" font-family="Arial, sans-serif" font-size="22" font-weight="700">CONSUME</text>
    <text x="24" y="64" fill="#82909C" font-family="Arial, sans-serif" font-size="15">100 ms · flash interno único</text>
