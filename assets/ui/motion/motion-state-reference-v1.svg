    <text x="24" y="38" fill="#E7EDF2" font-family="Arial, sans-serif" font-size="22" font-weight="700">INDISPONÍVEL</text>
    <text x="24" y="64" fill="#82909C" font-family="Arial, sans-serif" font-size="15">Sem cor e sem movimento</text>
    <g transform="translate(49 108)" opacity="0.48"><use href="#large-slot"/></g>
    <rect x="57" y="116" width="194" height="108" rx="6" fill="#39424A" opacity="0.64"/>
    <text x="154" y="184" text-anchor="middle" fill="#AEB8C0" font-family="Arial, sans-serif" font-size="44">—</text>
    <text x="24" y="294" fill="#AEB8C0" font-family="Arial, sans-serif" font-size="14">Nunca inventa disponibilidade.</text>
  </g>

  <path d="M70 972 H1730" stroke="#22313D" stroke-width="2"/>
  <text x="70" y="1012" fill="#82909C" font-family="Arial, sans-serif" font-size="16">1 transação espacial por vez · até 2 acentos locais · sem gradiente ou bloom incorporado</text>
</svg>
