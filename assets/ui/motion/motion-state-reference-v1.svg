    <text x="24" y="38" fill="#E7EDF2" font-family="Arial, sans-serif" font-size="22" font-weight="700">MOVE</text>
    <text x="24" y="64" fill="#82909C" font-family="Arial, sans-serif" font-size="15">160 ms · desliza sem fade</text>
    <g transform="translate(32 126)" opacity="0.24"><use href="#small-slot"/></g>
    <g transform="translate(110 126)" opacity="0.52"><use href="#small-slot"/></g>
    <g transform="translate(188 126)"><use href="#small-slot"/></g>
