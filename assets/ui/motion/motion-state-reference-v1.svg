    <circle cx="148" cy="115" r="7" fill="#7CFF4B"/>
    <text x="24" y="294" fill="#AEB8C0" font-family="Arial, sans-serif" font-size="14">Dispara apenas na entrada do proc.</text>
  </g>

  <g transform="translate(1084 592)">
    <rect width="316" height="325" rx="14" fill="#081018" stroke="#22313D" stroke-width="2"/>
    <text x="24" y="38" fill="#E7EDF2" font-family="Arial, sans-serif" font-size="22" font-weight="700">REFRESH</text>
    <text x="24" y="64" fill="#82909C" font-family="Arial, sans-serif" font-size="15">Encaixe inferior âmbar</text>
