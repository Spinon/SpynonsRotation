    <path d="M158 119 A39 39 0 0 1 197 158 L158 158 Z" fill="#10202B"/>
    <text x="158" y="169" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="30" font-weight="700">3.2</text>
    <text x="24" y="294" fill="#AEB8C0" font-family="Arial, sans-serif" font-size="14">Canaleta pausa ou escurece.</text>
  </g>

  <g transform="translate(746 592)">
    <rect width="316" height="325" rx="14" fill="#081018" stroke="#22313D" stroke-width="2"/>
    <text x="24" y="38" fill="#E7EDF2" font-family="Arial, sans-serif" font-size="22" font-weight="700">PROC</text>
    <text x="24" y="64" fill="#82909C" font-family="Arial, sans-serif" font-size="15">Pulso verde único</text>
    <g transform="translate(53 108)"><use href="#large-slot"/></g>
